<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NTHU StudyBuddy 💜</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{nthu:{500:'#8A2BE2',600:'#7B1FA2',700:'#5e1488'},dk:'#0F0F13',card:'#181820',line:'#2A2A38'}}}}</script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
.hidden{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
</style>
<style type="text/tailwindcss">
@layer components{
 .card{@apply rounded-2xl border border-gray-200 dark:border-line bg-white dark:bg-card p-5}
 .btn-p{@apply px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-nthu-500 hover:bg-nthu-600 transition active:scale-95 disabled:opacity-40}
 .btn-g{@apply px-4 py-2.5 rounded-xl text-sm font-semibold bg-gray-100 dark:bg-line hover:opacity-80 transition active:scale-95 disabled:opacity-40}
 .inp{@apply w-full p-2.5 text-sm rounded-xl bg-gray-50 dark:bg-dk border border-gray-200 dark:border-line outline-none focus:border-nthu-500}
 .chip{@apply px-3 py-1.5 rounded-full text-xs border border-nthu-500/50 cursor-pointer select-none}
 .chip.on{@apply bg-nthu-500 text-white}
 .nav{@apply px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap flex-1 md:flex-none text-gray-500 dark:text-gray-400}
 .nav.on{@apply bg-white dark:bg-nthu-600 text-nthu-600 dark:text-white shadow}
 .modal{@apply fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4}
 .mbox{@apply card w-full max-w-sm space-y-4 text-center border-nthu-500/30}
}
</style>
</head>
<body class="bg-gray-50 dark:bg-dk text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

<header class="sticky top-0 z-40 bg-white/80 dark:bg-card/80 backdrop-blur border-b border-gray-200 dark:border-line px-4 py-3">
 <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
  <div class="flex items-center gap-2 cursor-pointer" onclick="show('home')">
   <div id="logo" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-nthu-700 to-nthu-500 flex items-center justify-center overflow-hidden">💜</div>
   <div><div class="font-extrabold leading-tight">NTHU StudyBuddy</div><div class="text-[10px] text-gray-400 leading-tight">National Tsing Hua University</div></div>
  </div>
  <nav class="order-last md:order-none w-full md:w-auto flex gap-1 overflow-x-auto bg-gray-100 dark:bg-dk p-1 rounded-xl">
   <button class="nav" data-v="home" onclick="show('home')" data-i="n_home"></button>
   <button class="nav" data-v="lobby" onclick="show('lobby')" data-i="n_lobby"></button>
   <button class="nav" data-v="profile" onclick="show('profile')" data-i="n_profile"></button>
   <button class="nav" data-v="rules" onclick="show('rules')" data-i="n_rules"></button>
  </nav>
  <div class="flex items-center gap-2">
   <button id="th" onclick="toggleTheme()" class="btn-g !px-3"></button>
   <button id="lg" onclick="toggleLang()" class="btn-g !px-3 text-xs"></button>
   <button id="hd-av" onclick="show('profile')" class="w-9 h-9 rounded-full overflow-hidden border-2 border-nthu-500"></button>
  </div>
 </div>
</header>

<main class="flex-grow w-full max-w-6xl mx-auto p-4 sm:p-6">

<!-- HOME -->
<section id="v-home" class="space-y-6">
 <div class="rounded-3xl p-8 sm:p-12 bg-gradient-to-br from-nthu-700 via-purple-900 to-dk text-white">
  <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 text-xs mb-4"><span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span><span data-i="live"></span><span>·</span><span id="live"></span></div>
  <h1 class="text-4xl sm:text-6xl font-extrabold leading-tight"><span data-i="hero1"></span><br><span class="text-purple-300" data-i="hero2"></span></h1>
  <p class="mt-4 max-w-xl text-gray-300" data-i="hero_p"></p>
  <div class="mt-6 flex flex-wrap gap-3">
   <button class="btn-p !bg-white !text-nthu-700" onclick="openSetup()" data-i="b_quick"></button>
   <button class="btn-g !bg-white/10 !text-white" onclick="show('lobby')" data-i="b_lobby"></button>
  </div>
 </div>
 <div class="grid md:grid-cols-3 gap-4">
  <div class="card"><div class="text-xs text-gray-500" data-i="s_streak"></div><div id="st-streak" class="text-3xl font-extrabold">0</div><div class="text-xs text-green-500" data-i="s_freeze"></div></div>
  <div class="card"><div class="text-xs text-gray-500" data-i="s_title"></div><div id="st-title" class="text-xl font-bold mt-1"></div><div id="st-hours" class="text-xs text-gray-400"></div></div>
  <div class="card"><div class="text-xs text-gray-500" data-i="s_rating"></div><div class="text-3xl font-extrabold">4.9 ⭐</div><div class="text-xs text-purple-400" data-i="s_badges"></div></div>
 </div>
 <div class="space-y-3">
  <h2 class="text-xl font-bold" data-i="how_t"></h2>
  <div class="grid sm:grid-cols-3 gap-4">
   <div class="card"><b data-i="h1t"></b><p class="text-sm text-gray-500 mt-1" data-i="h1d"></p></div>
   <div class="card"><b data-i="h2t"></b><p class="text-sm text-gray-500 mt-1" data-i="h2d"></p></div>
   <div class="card"><b data-i="h3t"></b><p class="text-sm text-gray-500 mt-1" data-i="h3d"></p></div>
  </div>
 </div>
</section>

<!-- LOBBY -->
<section id="v-lobby" class="hidden space-y-5">
 <div class="card space-y-4">
  <div class="flex flex-wrap justify-between items-center gap-3">
   <div><h2 class="text-xl font-bold" data-i="l_title"></h2><p class="text-xs text-gray-500" data-i="l_desc"></p></div>
   <button class="btn-p" onclick="openModal('m-post')" data-i="l_post"></button>
  </div>
  <div class="grid sm:grid-cols-3 gap-3">
   <select id="f-mode" class="inp" onchange="renderLobby()"><option value="all" data-i="f_mall"></option><option value="strict" data-i="m_strict"></option><option value="social" data-i="m_social"></option></select>
   <select id="f-gender" class="inp" onchange="renderLobby()"><option value="all" data-i="f_gall"></option><option value="same" data-i="f_gsame"></option><option value="opp" data-i="f_gopp"></option></select>
   <select id="f-loc" class="inp" onchange="renderLobby()"><option value="all" data-i="f_lall"></option><option value="main" data-i="loc_main"></option><option value="nanda" data-i="loc_nanda"></option></select>
  </div>
 </div>
 <div id="lobby" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</section>

<!-- SESSION -->
<section id="v-session" class="hidden">
 <div class="card max-w-2xl mx-auto text-center space-y-5 p-6 sm:p-8">
  <div class="flex items-center justify-center gap-3">
   <div id="s-av" class="w-14 h-14 rounded-full overflow-hidden border-2 border-nthu-500"></div>
   <div class="text-left"><div id="s-name" class="font-bold text-lg"></div><span id="s-mode" class="text-[11px] px-2 py-0.5 rounded bg-nthu-500/20 text-nthu-500"></span></div>
  </div>
  <div>
   <div id="tm-ph" class="text-sm text-gray-400"></div>
   <div id="tm" class="text-6xl sm:text-8xl font-extrabold tabular-nums tracking-tight">50:00</div>
   <div class="h-2 rounded-full bg-gray-200 dark:bg-line overflow-hidden mt-3"><div id="bar" class="h-full bg-nthu-500 transition-all" style="width:0"></div></div>
   <div class="flex justify-between text-xs text-gray-400 mt-1"><span id="s-round"></span><span id="s-passes"></span></div>
  </div>
  <div id="pass-on" class="hidden text-sm p-3 rounded-xl bg-yellow-500/10 text-yellow-600 dark:text-yellow-400"><span id="pass-msg"></span> <button id="b-back" class="btn-g ml-2 !py-1" onclick="backFromPass()" data-i="b_back"></button></div>
  <div class="flex flex-wrap justify-center gap-3">
   <button id="b-pass" class="btn-g" onclick="usePass()" data-i="b_pass"></button>
   <button class="btn-g !text-red-500" onclick="endSession()" data-i="b_end"></button>
  </div>
    <div id="chat" class="hidden text-left border-t border-gray-200 dark:border-line pt-4 space-y-3">
   <div id="chat-on" class="space-y-3">
    <h4 class="font-bold text-sm" data-i="chat_t"></h4>
    <div id="ice" class="text-xs p-3 rounded-xl bg-nthu-500/10"></div>
    <div id="chat-log" class="h-36 overflow-y-auto p-3 rounded-xl bg-gray-50 dark:bg-dk space-y-2 flex flex-col"></div>
    <div class="flex gap-2 text-xl"><button onclick="say('👍')">👍</button><button onclick="say('☕')">☕</button><button onclick="say('💪')">💪</button><button onclick="say('😴')">😴</button></div>
    <div class="flex gap-2"><input id="chat-in" class="inp" data-p="chat_ph" onkeydown="event.key=='Enter'&&sendChat()"><button class="btn-p" onclick="sendChat()" data-i="send"></button></div>
   </div>
   <div id="chat-off" class="hidden text-sm text-center text-gray-500" data-i="chat_off"></div>
  </div>
 </div>
</section>

<!-- PROFILE -->
<section id="v-profile" class="hidden space-y-5">
 <div class="card flex items-center gap-5">
  <div id="p-av" class="w-20 h-20 rounded-full overflow-hidden border-4 border-nthu-500 shrink-0"></div>
  <div><h2 class="text-2xl font-bold" data-i="p_name"></h2><div class="text-xs text-gray-400">@gapp.nthu.edu.tw</div><div id="p-title" class="mt-2 inline-block text-xs px-3 py-1 rounded-full bg-nthu-500/20 text-nthu-500 font-semibold"></div></div>
 </div>
 <div class="card space-y-3"><h3 class="font-bold text-sm" data-i="p_av"></h3><div id="avs" class="grid grid-cols-3 sm:grid-cols-6 gap-3"></div></div>
 <div class="card space-y-3"><h3 class="font-bold text-sm" data-i="p_bg"></h3><div id="bgs" class="grid grid-cols-2 sm:grid-cols-5 gap-3"></div></div>
</section>

<!-- RULES -->
<section id="v-rules" class="hidden">
 <div class="card space-y-3 p-8">
  <h2 class="text-2xl font-bold" data-i="ru_t"></h2>
  <ul class="list-disc pl-5 space-y-2 text-sm text-gray-600 dark:text-gray-400">
   <li data-h="ru1"></li><li data-h="ru2"></li><li data-h="ru3"></li><li data-h="ru4"></li><li data-h="ru5"></li>
  </ul>
 </div>
</section>
</main>

<!-- MODALS -->
<div id="m-setup" class="modal hidden"><div class="mbox">
 <h3 class="text-lg font-bold" data-i="su_t"></h3>
 <select id="su-mode" class="inp"><option value="strict" data-i="m_strict"></option><option value="social" data-i="m_social"></option></select>
 <select id="su-gender" class="inp"><option value="all" data-i="f_gall"></option><option value="same" data-i="f_gsame"></option><option value="opp" data-i="f_gopp"></option></select>
 <button class="btn-p w-full" onclick="findMatch()" data-i="su_find"></button>
 <button class="btn-g w-full" onclick="closeModal('m-setup')" data-i="cancel"></button>
</div></div>

<div id="m-post" class="modal hidden"><div class="mbox">
 <h3 class="text-lg font-bold" data-i="po_t"></h3>
 <select id="po-mode" class="inp"><option value="strict" data-i="m_strict"></option><option value="social" data-i="m_social"></option></select>
 <select id="po-loc" class="inp"><option value="main" data-i="loc_main"></option><option value="nanda" data-i="loc_nanda"></option></select>
 <input id="po-topic" class="inp" maxlength="60" data-p="po_topic">
 <button class="btn-p w-full" onclick="submitPost()" data-i="po_go"></button>
 <button class="btn-g w-full" onclick="closeModal('m-post')" data-i="cancel"></button>
</div></div>

<div id="m-qr" class="modal hidden"><div class="mbox">
 <h3 class="text-lg font-bold" data-i="qr_t"></h3>
 <div id="qr-host" class="space-y-3">
  <p class="text-xs text-gray-400" data-i="qr_host_d"></p>
  <div class="w-40 h-40 mx-auto bg-white p-2 rounded-2xl"><img id="qr-img" class="w-full h-full" alt="" onerror="this.style.visibility='hidden'"></div>
  <div id="qr-my" class="text-4xl font-extrabold tracking-widest tabular-nums"></div>
  <div class="text-xs text-nthu-500 animate-pulse" data-i="qr_wait"></div>
 </div>
 <div id="qr-guest" class="hidden space-y-3">
  <p class="text-xs text-gray-400" data-i="qr_d"></p>
  <div id="qr-reader" class="w-full rounded-xl overflow-hidden hidden bg-black"></div>
  <button id="btn-scan-cam" class="btn-p w-full" onclick="startScanner()" data-i="qr_cam"></button>
  <input id="qr-in" class="inp text-center tracking-widest" inputmode="numeric" maxlength="6" data-p="qr_enter" onkeydown="event.key=='Enter'&&confirmQR()">
  <button class="btn-p w-full !bg-green-500 hover:!bg-green-600" onclick="confirmQR()" data-i="qr_ok"></button>
 </div>
 <button class="btn-g w-full" onclick="closeModal('m-qr');stopScanner()" data-i="cancel"></button>
</div></div>

<div id="m-rate" class="modal hidden"><div class="mbox">
 <h3 class="text-lg font-bold" data-i="r_t"></h3>
 <p class="text-xs text-gray-400" data-i="r_d"></p>
 <div id="stars" class="flex justify-center gap-1"></div>
 <div class="flex flex-wrap justify-center gap-2">
  <span class="chip" onclick="this.classList.toggle('on')" data-i="r_quiet"></span>
  <span class="chip" onclick="this.classList.toggle('on')" data-i="r_focus"></span>
  <span class="chip" onclick="this.classList.toggle('on')" data-i="r_friend"></span>
 </div>
 <button class="btn-p w-full" onclick="finish(false)" data-i="r_go"></button>
 <button class="w-full text-xs text-red-400 py-1" onclick="finish(true)" data-i="r_rep"></button>
</div></div>

<div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] space-y-2 w-[90%] max-w-sm"></div>

};

/* ---------- STATE ---------- */
const $=id=>document.getElementById(id);
const t=k=>(T[S.lang]&&T[S.lang][k])||T.en[k]||k;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={lang:'en',theme:'dark',av:0,min:0,ses:0,streak:0,last:0,frz:-1,owl:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('nthu_sb')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nthu_sb',JSON.stringify(S))}catch(e){}};
const MODE={strict:{f:50,b:10},social:{f:50,b:15}};
const AV=[
 {id:'TechCoder',f:'tech',g:'m',k:'av1'},{id:'SportyChill',f:'sporty',g:'m',k:'av2'},{id:'ClassicScholar',f:'scholar',g:'m',k:'av3'},
 {id:'BobaLover',f:'boba',g:'f',k:'av4'},{id:'CreativeDesign',f:'creative',g:'f',k:'av5'},{id:'FocusAchiever',f:'focus',g:'f',k:'av6'}];
const img=(a,c)=>`<img class="${c||''}" alt="" src="images/avatar-${a.f}.png" onerror="this.onerror=null;this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${a.id}'">`;
let ses=null,sd=null,sref=null,chatRef=null,pending=null,rate=5,lastPh='',offset=0,online=0,studying=0,lobby=[];
const mySessionId=(()=>{let u=sessionStorage.getItem('uid');if(!u){u=Math.random().toString(36).slice(2,10);sessionStorage.setItem('uid',u)}return u})();
const DEMO=location.search.includes('demo');   // add ?demo to the URL = timer runs x60
const now=()=>Date.now()+offset;
const rnd6=()=>String(Math.floor(100000+Math.random()*900000));
if(db){
 db.ref('.info/serverTimeOffset').on('value',x=>offset=x.val()||0);
 db.ref('.info/connected').on('value',x=>{if(x.val()){const r=db.ref('presence/'+mySessionId);r.onDisconnect().remove();r.set(!!ses)}});
 db.ref('presence').on('value',x=>{online=x.numChildren();studying=0;x.forEach(c=>{if(c.val()===true)studying++});showLive()});
 db.ref('lobby').on('value',snap=>{lobby=[];snap.forEach(c=>{const d=c.val();lobby.push({fbKey:c.key,uid:d.uid,me:d.uid===mySessionId,code:d.code,n:d.n,d:d.d,m:d.m,l:d.l,a:d.a,topic:d.topic})});renderLobby()});
}
const setStudying=v=>{if(db)db.ref('presence/'+mySessionId).set(v)};

/* ---------- NAV / THEME / LANG ---------- */
function show(v){
 ['home','lobby','session','profile','rules'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!=v));
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
 scrollTo(0,0);
}
function applyTheme(){document.documentElement.classList.toggle('dark',S.theme=='dark');$('th').textContent=S.theme=='dark'?'🌙':'☀️'}
function toggleTheme(){S.theme=S.theme=='dark'?'light':'dark';save();applyTheme()}
function applyLang(){
 document.documentElement.lang=S.lang=='zh'?'zh-Hant':'en';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=t(e.dataset.h));
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 $('lg').textContent=S.lang=='en'?'🌐 EN / 繁中':'🌐 繁中 / EN';
 renderLobby();renderProfile();renderStats();renderSes();showLive();
}
function toggleLang(){S.lang=S.lang=='en'?'zh':'en';save();applyLang()}
function toast(m){const d=document.createElement('div');d.className='card !py-3 text-sm text-center shadow-lg border-nthu-500/40';d.textContent=m;$('toasts').append(d);setTimeout(()=>d.remove(),3500)}
const openModal=id=>$(id).classList.remove('hidden'),closeModal=id=>$(id).classList.add('hidden');
function showLive(){$('live').textContent=t('live_n').replace('{s}',studying).replace('{o}',online)}

/* ---------- LOBBY ---------- */
function renderLobby(){
 const fm=$('f-mode').value,fg=$('f-gender').value,fl=$('f-loc').value,me=AV[S.av].g;
 const list=lobby.filter(x=>(fm=='all'||x.m==fm)&&(fl=='all'||x.l==fl)&&(fg=='all'||(fg=='same')==(AV[x.a].g==me)));
 $('lobby').innerHTML=list.length?list.map(x=>`
 <div class="card space-y-3">
  <div class="flex items-center gap-3">
   <div class="w-11 h-11 rounded-full overflow-hidden border-2 border-nthu-500">${img(AV[x.a],'w-full h-full')}</div>
   <div><b class="text-sm">${x.me?t('you'):x.n}</b><div class="text-xs text-gray-400">${x.d} · ${t('loc_'+x.l)}</div></div>
  </div>
  <div class="text-xs">📌 ${t('m_'+x.m)}</div>
  <div class="text-xs text-gray-400">📖 ${esc(x.topic)}</div>
  ${x.me?`<button class="btn-p !bg-nthu-600 w-full" onclick="join('${x.fbKey}')">📲 ${t('qr_t')}</button>`:`<button class="btn-p w-full" onclick="join('${x.fbKey}')">🤝 ${t('l_join')}</button>`}
 </div>`).join(''):`<p class="text-sm text-gray-400 col-span-full">${t('l_empty')}</p>`;
}
function submitPost(){
 if(!db)return toast('Firebase offline');
 const code=rnd6(),mode=$('po-mode').value,r=db.ref('lobby').push();
 r.onDisconnect().remove();
 r.set({uid:mySessionId,code,n:'NTHU Student',d:'Library',m:mode,l:$('po-loc').value,a:S.av,topic:$('po-topic').value.trim()||'—',ts:Date.now()});
 $('po-topic').value='';closeModal('m-post');toast(t('t_posted'));
 watchRoom(r.key);
 openQR({fbKey:r.key,code,m:mode,a:S.av,me:1},mode,'host');
}
/* host: wait until a guest creates sessions/<key> */
function watchRoom(key){
 const r=db.ref('sessions/'+key);
 r.on('value',x=>{const d=x.val();if(d&&d.startedAt&&!ses){r.off();closeModal('m-qr');attach(key,'host')}});
}

/* ---------- MATCH + QR CHECK-IN ---------- */
function openSetup(){openModal('m-setup')}
function findMatch(){
 const m=$('su-mode').value,g=$('su-gender').value,me=AV[S.av].g;
 let pool=lobby.filter(x=>!x.me&&x.m==m&&(g=='all'||(g=='same')==(AV[x.a].g==me)));
 if(!pool.length)pool=lobby.filter(x=>!x.me);
 if(!pool.length)return toast(t('l_empty'));
 closeModal('m-setup');openQR(pool[Math.floor(Math.random()*pool.length)],m,'guest');
}
function join(k){const b=lobby.find(x=>x.fbKey==k);if(b)openQR(b,b.m,b.me?'host':'guest')}
function openQR(b,mode,role){
 pending={b,mode,role,key:b.fbKey,code:b.code};
 const host=role=='host';
 $('qr-host').classList.toggle('hidden',!host);$('qr-guest').classList.toggle('hidden',host);
 if(host){$('qr-my').textContent=b.code;$('qr-img').style.visibility='visible';$('qr-img').src='https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+b.code}
 $('qr-in').value='';openModal('m-qr');
}
let scanner=null;
function startScanner(){
 if(typeof Html5QrcodeScanner==='undefined')return toast('Scanner not loaded');
 $('btn-scan-cam').classList.add('hidden');$('qr-reader').classList.remove('hidden');
 scanner=new Html5QrcodeScanner('qr-reader',{fps:10,qrbox:{width:200,height:200}},false);
 scanner.render(txt=>{$('qr-in').value=txt.trim();confirmQR()},()=>{});
}
function stopScanner(){
 if(scanner){try{scanner.clear()}catch(e){}scanner=null}
 $('qr-reader').classList.add('hidden');$('btn-scan-cam').classList.remove('hidden');
}
/* guest: verify code, then create the shared session (only one guest can win) */
function confirmQR(){
 if(!pending||pending.role!='guest'||!db)return;
 if($('qr-in').value.trim()!==pending.code)return toast(t('qr_bad'));
 stopScanner();closeModal('m-qr');
 const b=pending.b,key=pending.key;
 db.ref('sessions/'+key).transaction(cur=>cur?undefined:{mode:b.m,hostAv:b.a,guestAv:S.av,guestUid:mySessionId,
   startedAt:firebase.database.ServerValue.TIMESTAMP,speed:DEMO?60:1,pausedTotal:0,pausedAt:null,passes_host:2,passes_guest:2},
  (err,ok)=>{if(err||!ok)return toast(t('room_taken'));db.ref('lobby/'+key).remove();attach(key,'guest')});
}

/* ---------- SHARED SESSION ---------- */
function attach(key,role){
 sessionStorage.setItem('cur',key+':'+role);
 ses={key,role,end:0};sd=null;lastPh='';
 sref=db.ref('sessions/'+key);
 sref.on('value',x=>{
  const d=x.val();
  if(!d){if(ses&&!ses.end){toast(t('t_gone'));detach()}return}
  const first=!sd;sd=d;
  if(first){setStudying(true);$('chat-log').innerHTML='';show('session')}
  const o=ses.role=='host'?'guest':'host';
  if(d['left_'+o]&&!ses.warned){ses.warned=1;toast(t('t_left'))}
  renderSes();
 });
 chatRef=sref.child('chat');
 chatRef.on('child_added',x=>{const c=x.val();if(ses)bubble(c.r==ses.role,c.x)});
}
function detach(){
 if(sref)sref.off();if(chatRef)chatRef.off();
 sref=chatRef=sd=ses=null;sessionStorage.removeItem('cur');setStudying(false);show('home');
}
function restoreSession(){
 const c=sessionStorage.getItem('cur');if(!c||!db)return;
 const [k,r]=c.split(':');
 db.ref('sessions/'+k).once('value',x=>{if(x.val()&&x.val().startedAt)attach(k,r);else sessionStorage.removeItem('cur')});
}
/* every phone derives the same clock from the shared start time */
function calc(){
 const m=MODE[sd.mode],F=m.f*60,C=F+m.b*60,sp=sd.speed||1;
 const el=Math.max(0,((sd.pausedAt||now())-sd.startedAt-(sd.pausedTotal||0))/1000*sp);
 const r=el%C,f=r<F;
 return{ph:sd.pausedAt?'pass':f?'focus':'break',left:f?F-r:C-r,round:Math.floor(el/C)+1,el,F,C,r};
}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function renderSes(){
 if(!ses||!sd)return;
 const c=calc(),m=MODE[sd.mode],sp=sd.speed||1,me=ses.role;
 const pl=sd.pausedAt?600-(now()-sd.pausedAt)/1000*sp:0;
 const left=c.ph=='pass'?pl:c.left,tot=c.ph=='focus'?c.F:c.ph=='break'?m.b*60:600;
 const bav=me=='host'?sd.guestAv:sd.hostAv,mp=sd['passes_'+me]??2,mineP=sd.pausedBy==me;
 $('tm').textContent=fmt(left);$('tm-ph').textContent=t('ph_'+c.ph);$('bar').style.width=Math.min(100,100-left/tot*100)+'%';
 $('s-av').innerHTML=img(AV[bav],'w-full h-full');$('s-name').textContent=t('p_name');$('s-mode').textContent=t('m_'+sd.mode);
 $('s-round').textContent=S.lang=='zh'?t('round')+' '+c.round+' 輪':t('round')+' '+c.round;
 $('s-passes').textContent=t('pass_left').replace('{n}',mp);
 $('pass-on').classList.toggle('hidden',c.ph!='pass');$('pass-msg').textContent=t(mineP?'pass_on':'pass_buddy');
 $('b-back').classList.toggle('hidden',!mineP);$('b-pass').disabled=c.ph!='focus'||mp<1;
 const soc=sd.mode=='social';
 $('chat').classList.toggle('hidden',c.ph!='break');$('chat-on').classList.toggle('hidden',!soc);$('chat-off').classList.toggle('hidden',soc);
 $('ice').textContent='💡 '+t('ice'+(c.round%3));
 if(lastPh&&lastPh!=c.ph&&c.ph!='pass')toast(t(c.ph=='break'?'t_break':'t_focus'));
 if(c.ph!='pass')lastPh=c.ph;
}
setInterval(()=>{
 if(!ses||!sd||ses.end)return;
 if(sd.pausedAt&&(now()-sd.pausedAt)/1000*(sd.speed||1)>=600)resume();
 renderSes();
},1000);
function usePass(){
 if(!sd||calc().ph!='focus')return;
 const me=ses.role,k='passes_'+me;
 sref.transaction(x=>{if(x&&!x.pausedAt&&(x[k]??2)>0){x.pausedAt=now();x.pausedBy=me;x[k]=(x[k]??2)-1;return x}});
}
function resume(){
 if(sref)sref.transaction(x=>{if(x&&x.pausedAt){x.pausedTotal=(x.pausedTotal||0)+(now()-x.pausedAt);x.pausedAt=null;x.pausedBy=null;return x}});
}
const backFromPass=resume;

/* ---------- CHAT (shared) ---------- */
function bubble(me,txt){
 const d=document.createElement('div');
 d.className='max-w-[80%] px-3 py-1.5 rounded-xl text-sm '+(me?'self-end bg-nthu-600 text-white':'self-start bg-gray-200 dark:bg-line');
 d.textContent=txt;$('chat-log').append(d);$('chat-log').scrollTop=1e9;
}
function say(x){if(chatRef&&ses)chatRef.push({r:ses.role,x:String(x).slice(0,200),ts:Date.now()})}
function sendChat(){const v=$('chat-in').value.trim();if(!v)return;$('chat-in').value='';say(v)}

/* ---------- END + RATING ---------- */
function paintStars(){$('stars').innerHTML=[1,2,3,4,5].map(i=>`<button class="text-4xl ${i<=rate?'text-yellow-400':'text-gray-500'}" onclick="rate=${i};paintStars()">★</button>`).join('')}
function endSession(){
 ses.end=1;rate=5;paintStars();
 document.querySelectorAll('#m-rate .chip').forEach(c=>c.classList.remove('on'));openModal('m-rate');
}
function dayNum(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)}
function updateStreak(){
 const d=dayNum(),w=Math.floor(d/7),diff=d-S.last;
 if(S.last===d)return;
 if(S.last&&diff==1)S.streak++;
 else if(S.last&&diff==2&&S.frz!=w){S.streak++;S.frz=w;toast(t('t_freeze'))}
 else S.streak=1;
 S.last=d;
}
function finish(report){
 closeModal('m-rate');if(report)toast(t('t_report'));
 const c=sd?calc():null,mn=c?(Math.floor(c.el/c.C)*c.F+Math.min(c.r,c.F))/60:0;
 if(mn>=1){S.min+=mn;S.ses++;updateStreak();const h=new Date().getHours();if(h>=22||h<5)S.owl=1;toast(t('t_done'))}
 else toast(t('t_short'));
 save();
 const key=ses.key,role=ses.role,o=role=='host'?'guest':'host',other=sd&&sd['left_'+o];
 if(other)db.ref('sessions/'+key).remove();else db.ref('sessions/'+key+'/left_'+role).set(true);
 detach();renderStats();renderProfile();
}

/* ---------- STATS + PROFILE ---------- */
const title=()=>S.min>=3000?'ti3':S.min>=600?'ti2':S.min>=60?'ti1':'ti0';
const BG=[['🌱','bg1',()=>S.ses>=1],['⚡','bg2',()=>S.streak>=3],['🦉','bg3',()=>S.owl],['📚','bg4',()=>S.min>=600],['🔥','bg5',()=>S.min>=3000]];
function renderStats(){
 $('st-streak').textContent=S.streak+' '+t('days');
 $('st-title').textContent=t(title());
 $('st-hours').textContent=t('hrs').replace('{h}',(S.min/60).toFixed(1));
 $('p-title').textContent=t(title());
}
function renderHdr(){$('hd-av').innerHTML=img(AV[S.av],'w-full h-full');$('p-av').innerHTML=img(AV[S.av],'w-full h-full')}
function pick(i){S.av=i;save();renderHdr();renderProfile();renderLobby()}
function renderProfile(){
 $('avs').innerHTML=AV.map((a,i)=>`<button onclick="pick(${i})" class="p-2 rounded-2xl border-2 ${i==S.av?'border-nthu-500 bg-nthu-500/10':'border-transparent'}"><div class="w-full aspect-square rounded-full overflow-hidden">${img(a,'w-full h-full')}</div><div class="text-[11px] font-semibold mt-1">${t(a.k)}</div></button>`).join('');
 $('bgs').innerHTML=BG.map(b=>`<div class="p-3 rounded-xl border border-gray-200 dark:border-line text-center ${b[2]()?'':'opacity-30 grayscale'}"><div class="text-3xl">${b[0]}</div><div class="text-xs font-bold mt-1">${t(b[1])}</div></div>`).join('');
}

/* ---------- INIT ---------- */
(function(){const im=new Image();im.onload=()=>{$('logo').innerHTML='<img src="images/logo.png" class="w-full h-full object-cover" alt="">'};im.src='images/logo.png'})();
applyTheme();renderHdr();applyLang();show('home');restoreSession();
</script>
</body>
